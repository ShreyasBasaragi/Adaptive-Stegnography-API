services:
  - type: web
    name: adaptive-stego-api
    runtime: python
    buildCommand: |
      pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-api.txt
    startCommand: uvicorn stego_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /health
